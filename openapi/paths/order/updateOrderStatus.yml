updateOrderStatus:
  operationId: updateOrderStatus

  security:
    - BearerAuth: []

  tags:
    - Order

  summary: Update Order Status

  description: |
    Update an order status.

    Allowed Role:
    - VENDOR

  parameters:
    - in: path
      name: orderId
      required: true

      schema:
        type: string

      example: 000e7811-84e9-42c2-80f5-24f239ce0002

  requestBody:
    required: true

    content:
      application/json:
        schema:
          $ref: '../../components/schemas/order.yml#/UpdateOrderStatusRequest'

  responses:
    "200":
      description: Order status updated successfully

      content:
        application/json:
          schema:
            $ref: '../../components/responses/order.yml#/UpdateOrderStatusResponse'

    "400":
      description: Invalid status transition

      content:
        application/json:
          schema:
            $ref: '../../components/responses/order.yml#/InvalidOrderStatusTransition'

    "401":
      $ref: '../../components/responses/common.yml#/Unauthorized'

    "403":
      description: Only ADMIN and VENDOR can update order status

    "404":
      description: Order not found

    "500":
      $ref: '../../components/responses/common.yml#/ServerError'