restoreVendorProfile:
  security:
    - BearerAuth: []

  operationId: restoreVendorProfile
  tags:
    - Admin Dashboard

  summary: Restore Vendor Profile
  description: Restore soft-deleted vendor.

  parameters:
    - $ref: '../components/parameters/vendor.yml#/VendorId'

  responses:
    '200':
      description: Vendor restored successfully
      content:
        application/json:
          example:
            success: true
            message: Vendor restored successfully
            data:
              id: '0bef8e9c-f52a-4c7a-bd12-89af19a70656'
              isDeleted: false

    '400':
      description: Bad Request
    '401':
      description: Unauthorized
    '404':
      $ref: '../components/responses/vendor.yml#/VendorNotFound'
    '500':
      $ref: '../components/responses/common.yml#/ServerError'
