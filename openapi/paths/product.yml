getPublicProducts:
  operationId: getPublicProducts
  security: []
  tags:
    - Product

  summary: Get public products

  description: Get paginated public products with filters

  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number

    - in: query
      name: limit
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
      description: Number of products per page

    - in: query
      name: search
      schema:
        type: string
      description: Search by product name

    - in: query
      name: minPrice
      schema:
        type: number
      description: Minimum price

    - in: query
      name: maxPrice
      schema:
        type: number
      description: Maximum price

  responses:
    '200':
      description: Public products retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/PublicProductResponse'

    '400':
      description: Bad Request

    '500':
      description: Server Error

getPublicProduct:
  operationId: getPublicProduct
  security: []
  tags:
    - Product

  summary: Get single product

  description: Get product by ID

  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    '200':
      description: Product retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/PublicProductResponse'

    '404':
      description: Product not found

    '400':
      description: Bad Request

    '500':
      description: Server Error

getProductsByAdmin:
  operationId: getProductsByAdmin
  security:
    - BearerAuth: []

  tags:
    - Product

  summary: Get all products (Admin)

  description: Admin only - get all products

  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
        minimum: 1

    - in: query
      name: limit
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100

    - in: query
      name: phone
      schema:
        type: string
      description: Filter vendor products by phone

    - in: query
      name: status
      schema:
        type: string
        enum:
          - ACTIVE
          - OUT_OF_STOCK
          - INACTIVE
      description: Filter by product status

    - in: query
      name: isDeleted
      schema:
        type: boolean
      description: Filter deleted products

  responses:
    '200':
      description: Products retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/ProtectedProductResponse'

    '400':
      description: Bad Request

    '401':
      description: Unauthorized

    '500':
      description: Server Error

restoreProductByAdmin:
  operationId: restoreProductByAdmin
  security:
    - BearerAuth: []

  tags:
    - Product

  summary: Restore deleted product (Admin)

  description: Admin only - restore a soft-deleted product by ID

  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    '200':
      description: Product restored successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/ProtectedProductResponse'

    '404':
      description: Product not found

    '400':
      description: Product is not deleted

    '500':
      description: Server Error

getVendorProducts:
  operationId: getVendorProducts
  security:
    - BearerAuth: []

  tags:
    - Product

  summary: Get products by vendor

  description: Get products created by logged-in vendor

  responses:
    '200':
      description: Vendor products retrieved successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/PublicProductResponse'

    '400':
      description: Bad Request

    '401':
      description: Unauthorized

    '403':
      description: You do not have permission to access this products

    '500':
      description: Server Error

createProduct:
  tags:
    - Product

  operationId: createProduct

  summary: Create product

  description: Vendor creates a new product

  security:
    - BearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/product.yml#/CreateProductRequest'

  responses:
    '201':
      description: Product created successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/PublicProductResponse'

    '401':
      description: Unauthorized

updateProduct:
  tags:
    - Product

  operationId: updateProduct

  summary: Update product

  description: Vendor updates own product

  security:
    - BearerAuth: []

  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/product.yml#/UpdateProductRequest'

  responses:
    '200':
      description: Product updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/ProtectedProductResponse'

    '404':
      description: Product not found

    '401':
      description: Unauthorized

deleteProduct:
  tags:
    - Product

  operationId: deleteProduct

  summary: Delete product

  description: Vendor deletes own product. Also admin can delete any product.

  security:
    - BearerAuth: []

  parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string

  responses:
    '200':
      description: Product deleted successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/product.yml#/PublicProductResponse'

    '404':
      description: Product not found

    '401':
      description: Unauthorized
