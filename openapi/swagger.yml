openapi: 3.0.0
info:
  title: E-Commerce API
  version: 1.0.0
  description: REST API Documentation
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:5000/api/v1
    description: local host
  - url: https://server-squad-backend.vercel.app/api/v1
    description: production level
tags:
  - name: Admin Authentication
    description: Admin authentication APIs
  - name: Vendor Authentication
    description: Vendor authentication APIs
  - name: Authentication
    description: Authentication APIs
  - name: Order
    description: Order APIs
  - name: Product
    description: Product APIs
  - name: Payment
    description: Payment APIs
  - name: Admin
    description: Admin APIs
  - name: Image Upload
    description: Image Upload APIs
  - name: Dashboard
    description: Dashboard APIs (Admin, Vendor, and Customer views)
  - name: Location
    description: Division and District APIs
  - name: Subscription
    description: Subscription plan, checkout, trial, and payment confirmation APIs
paths:
  /auth/admin/register:
    post:
      security: []
      operationId: registerAdmin
      tags:
        - Admin Authentication
      summary: Register Admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/vendor/register:
    post:
      security: []
      operationId: registerVendor
      tags:
        - Vendor Authentication
      summary: Register Vendor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorRegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/verify-email:
    post:
      security: []
      operationId: verifyEmail
      tags:
        - Authentication
      summary: Verify Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/InvalidVerificationCode'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/login:
    post:
      security: []
      operationId: login
      tags:
        - Authentication
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/refresh-token:
    post:
      security: []
      operationId: refreshToken
      tags:
        - Authentication
      summary: Refresh Access Token

      parameters:
        - in: cookie
          name: refreshToken
          required: true
          schema:
          type: string

      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /auth/logout:
    post:
      operationId: logout
      tags:
        - Authentication
      summary: Logout User
      security:
        - cookieAuth: []
      responses:
        '200':
          $ref: '#/components/responses/LogoutSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /orders:
    post:
      security: []
      operationId: placeOrder
      tags:
        - Order
      summary: Place Order
      description: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Bad Request
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      operationId: getAllOrderList
      security:
        - BearerAuth: []
      tags:
        - Order
      summary: Get All Orders
      description: |
        Retrieve orders based on authenticated user role.

        Allowed Roles:
        - ADMIN
        - VENDOR

        Role Behavior:
        - ADMIN can view all orders.
        - VENDOR can view only orders containing their own products.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Orders retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{id}:
    get:
      operationId: getSingleOrder
      security:
        - BearerAuth: []
      tags:
        - Order
      summary: Get Single Order
      description: Retrieve a single order by order id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 000e7811-84e9-42c2-80f5-24f239ce0002
      responses:
        '200':
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden
        '404':
          description: Order not found
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/{orderId}/status:
    patch:
      operationId: updateOrderStatus
      security:
        - BearerAuth: []
      tags:
        - Order
      summary: Update Order Status
      description: |
        Update an order status.

        Allowed Role:
        - VENDOR
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
          example: 000e7811-84e9-42c2-80f5-24f239ce0002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrderStatusResponse'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidOrderStatusTransition'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only ADMIN and VENDOR can update order status
        '404':
          description: Order not found
        '500':
          $ref: '#/components/responses/ServerError'
  /orders/track:
    get:
      operationId: trackOrder
      security: []
      tags:
        - Order
      summary: Track Guest Orders
      description: |
        Public endpoint.

        Track orders using guest customer token.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          example: eb75bec8-ccf8-44c1-9f4a-93e9d3845176
      responses:
        '200':
          description: Orders found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackOrderResponse'
        '400':
          description: Guest token is required
        '404':
          description: No orders found for this tracking ID
        '500':
          $ref: '#/components/responses/ServerError'
  /products/public:
    get:
      operationId: getPublicProducts
      security: []
      tags:
        - Product
      summary: Get public products
      description: Get paginated public products with filters
      responses:
        '200':
          description: Public products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Server Error
  /products:
    get:
      operationId: getProducts
      security: []
      tags:
        - Product
      summary: Get all products (Admin)
      description: Admin only - get all products
      responses:
        '200':
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Server Error
    post:
      tags:
        - Product
      operationId: createProduct
      summary: Create product
      description: Vendor creates a new product
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductResponse'
      responses:
        '201':
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Unauthorized
  /products/my-products:
    get:
      operationId: getVendorProducts
      security: []
      tags:
        - Product
      summary: Get vendor products
      description: Get products created by logged-in vendor
      responses:
        '200':
          description: Vendor products retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '500':
          description: Server Error
  /products/{id}:
    get:
      operationId: getProduct
      security: []
      tags:
        - Product
      summary: Get single product
      description: Get product by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProductResponse'
        '404':
          description: Product not found
    patch:
      tags:
        - Product
      operationId: updateProduct
      summary: Update product
      description: Vendor updates own product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductResponse'
      responses:
        '200':
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          description: Unauthorized
        '404':
          description: Product not found
    delete:
      tags:
        - Product
      operationId: deleteProduct
      summary: Delete product
      description: Vendor deletes own product
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Product not found
  /payment/initiate:
    post:
      security: []
      operationId: initiatePayment
      tags:
        - Payment
      summary: Initiate SSLCommerz Payment
      description: Create a payment session for an existing order and return SSLCommerz GatewayPageURL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '200':
          description: Payment session initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '404':
          description: Order not found
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/success:
    post:
      security: []
      operationId: paymentSuccessCallback
      tags:
        - Payment
      summary: SSLCommerz Success Callback
      description: Receive SSLCommerz success callback. Final payment verification is handled by IPN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCommerzCallbackRequest'
      responses:
        '200':
          description: Payment success callback received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCallbackResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/fail:
    post:
      security: []
      operationId: paymentFailCallback
      tags:
        - Payment
      summary: SSLCommerz Fail Callback
      description: Receive SSLCommerz fail callback. Final failed status update is handled by IPN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCommerzCallbackRequest'
      responses:
        '200':
          description: Payment fail callback received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFailResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/cancel:
    post:
      security: []
      operationId: paymentCancelCallback
      tags:
        - Payment
      summary: SSLCommerz Cancel Callback
      description: Receive SSLCommerz cancel callback. Final cancelled status update is handled by IPN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCommerzCallbackRequest'
      responses:
        '200':
          description: Payment cancel callback received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCancelResponse'
        '500':
          $ref: '#/components/responses/ServerError'
  /payment/ipn:
    post:
      security: []
      operationId: paymentIpnCallback
      tags:
        - Payment
      summary: SSLCommerz IPN Callback
      description: Receive SSLCommerz IPN callback, validate transaction with SSLCommerz validation API, and update order payment or subscription payment status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SSLCommerzIpnRequest'
      responses:
        '200':
          description: Payment IPN received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIpnResponse'
        '400':
          description: Invalid SSLCommerz payment status, missing validation ID, validation failed, or amount mismatch
        '404':
          description: Order payment or subscription payment not found
        '500':
          $ref: '#/components/responses/ServerError'
  /cashout/vendor/{vendorId}/summary:
    get:
      security:
        - BearerAuth: []
      operationId: getCashoutSummary
      tags:
        - Cashout
      summary: Get vendor cashout summary
      description: Get vendor lifetime earning calculated from paid order items, pending cashout amount, lifetime cashout amount, available balance, and withdrawable balance.
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: string
          example: d59bc444-d489-48e3-a196-a99a25389918
      responses:
        '200':
          description: Cashout summary retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashoutSummaryResponse'
        '404':
          description: Vendor or cashout setting not found
        '500':
          $ref: '#/components/responses/ServerError'
  /cashout/vendor/{vendorId}/request:
    post:
      security:
        - BearerAuth: []
      operationId: createCashout
      tags:
        - Cashout
      summary: Create vendor cashout request
      description: Create a cashout request for a vendor. Requested amount will be locked while status is PENDING.
      parameters:
        - in: path
          name: vendorId
          required: true
          schema:
            type: string
          example: d59bc444-d489-48e3-a196-a99a25389918
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashoutRequest'
      responses:
        '201':
          description: Cashout request created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCashoutResponse'
        '400':
          description: Minimum cashout, pending request, or insufficient balance validation error
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /cashout/admin/cashouts:
    get:
      security:
        - BearerAuth: []
      operationId: getCashoutsForAdmin
      tags:
        - Cashout
      summary: Get cashout requests for admin
      description: Get cashout requests for admin with pagination, status filter, method filter, and search by cashoutId or vendorId.
      parameters:
        - in: query
          name: page
          required: false
          schema:
            type: number
          example: 1
        - in: query
          name: limit
          required: false
          schema:
            type: number
          example: 10
        - in: query
          name: status
          required: false
          schema:
            $ref: '#/components/schemas/CashoutStatus'
          example: PENDING
        - in: query
          name: method
          required: false
          schema:
            $ref: '#/components/schemas/CashoutMethod'
          example: BKASH
        - in: query
          name: searchTerm
          required: false
          schema:
            type: string
          example: d7b9687d-dd13-4dee-b78a-1773c5b1b50e
      responses:
        '200':
          description: Cashout requests retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCashoutListResponse'
        '400':
          description: Bad request
        '500':
          $ref: '#/components/responses/ServerError'
  /cashout/admin/cashouts/{id}/status:
    patch:
      security:
        - BearerAuth: []
      operationId: updateCashoutStatus
      tags:
        - Cashout
      summary: Update cashout status
      description: Update a pending cashout request status to COMPLETED, REJECTED, or FAILED.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: 52054f5c-6f64-42fc-9c85-80c33104f43a
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCashoutStatusRequest'
            examples:
              complete:
                summary: Complete cashout
                value:
                  status: COMPLETED
                  adminTransactionId: BKASH123456
              reject:
                summary: Reject cashout
                value:
                  status: REJECTED
                  rejectionReason: Invalid account information
              fail:
                summary: Fail cashout
                value:
                  status: FAILED
                  failureReason: bKash transfer failed
      responses:
        '200':
          description: Cashout status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashoutActionResponse'
        '400':
          description: Only pending cashout can be updated or required reason/transaction ID is missing
        '404':
          description: Cashout request not found
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /cashout/admin/settings:
    get:
      security:
        - BearerAuth: []
      operationId: getCashoutSetting
      tags:
        - Cashout
      summary: Get cashout settings
      description: Get current cashout charge rate and minimum cashout amount.
      responses:
        '200':
          description: Cashout setting retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashoutSettingResponse'
        '404':
          description: Cashout setting not found
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      security:
        - BearerAuth: []
      operationId: updateCashoutSetting
      tags:
        - Cashout
      summary: Update cashout settings
      description: Update cashout charge rate or minimum cashout amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCashoutSettingRequest'
      responses:
        '200':
          description: Cashout setting updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCashoutSettingResponse'
        '400':
          description: Invalid cashout setting payload
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
  /vendor/get-vendor-profile:
    get:
      security:
        - BearerAuth: []
      operationId: getVendorProfile
      tags:
        - Dashboard
      summary: Get Vendor Profile
      description: Get own vendor profile by vendor id
      responses:
        '200':
          description: Vendor Profile Retrieved Successfully
          content:
            application/json:
              example:
                success: true
                message: Vendor profile retrieved successfully
                data:
                  id: ac7cb1fe-4894-499d-938f-c0855444d3a1
                  avatar: https://i.pravatar.cc/300?img=12
                  shopName: Salman sssssssssss
                  shopLogo: null
                  subDomain: salman-hossain12345@shop
                  user:
                    name: Md. Salman Hossain Updated
                    email: salman-hossain12345@gmail.com
                    phone: '01362397610'
        '400':
          description: Bad Request (Invalid Vendor ID)
        '401':
          description: Unauthorized (No token or invalid token)
        '404':
          $ref: '#/components/responses/VendorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /vendor/update-vendor-profile:
    patch:
      security:
        - BearerAuth: []
      operationId: updateVendorProfile
      tags:
        - Dashboard
      summary: Update Vendor Profile
      description: Update own vendor profile information
      requestBody:
        required: true
        content:
          application/json:
            example:
              avatar: https://i.pravatar.cc/300?img=12
              shopName: 'Salman '
              shopLogo: https://via.placeholder.com/300x300.png?text=New+Shop+Logo+Updated
              name: Md. Salman Hossain Updated
              phone: '01712345675'
      responses:
        '200':
          description: Vendor Profile Updated Successfully
          content:
            application/json:
              example:
                success: true
                message: Vendor profile updated successfully
                data:
                  avatar: https://i.pravatar.cc/300?img=12
                  shopName: 'Salman '
                  shopLogo: https://via.placeholder.com/300x300.png?text=New+Shop+Logo+Updated
                  user:
                    name: Md. Salman Hossain Updated
                    phone: '01712345675'
        '400':
          description: Validation Error
        '401':
          description: Unauthorized
        '404':
          $ref: '#/components/responses/VendorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /vendor/delete-vendor-profile:
    delete:
      security:
        - BearerAuth: []
      operationId: deleteVendorProfile
      tags:
        - Dashboard
      summary: Delete Vendor Profile
      description: Soft delete vendor profile by vendor id
      responses:
        '200':
          description: Vendor Deleted Successfully
          content:
            application/json:
              example:
                success: true
                message: Vendor profile delete successfully
                data:
                  id: 21b304b7-01b6-463f-b3ae-f159fce69b0c
                  name: Nazmul Khan5
                  email: nazmul@5example.com
                  phone: '01711823511'
                  password: $2b$12$TITEN38bQitg7y.BJz4LZudnlxFiAW57AVm7iKHt.7Hs80yWjT8j6
                  role: VENDOR
                  isDeleted: true
                  deletedAt: '2026-06-10T17:56:05.651Z'
                  isVerified: true
                  createdAt: '2026-06-10T12:04:13.283Z'
                  updatedAt: '2026-06-10T17:56:05.651Z'
        '400':
          description: Bad Request (Invalid Vendor ID)
        '401':
          description: Unauthorized Access
        '404':
          $ref: '#/components/responses/VendorNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/get-all-vendor:
    get:
      security:
        - BearerAuth: []
      operationId: getAllVendor
      tags:
        - Admin
      summary: Get All Vendors
      description: Retrieve a list of all vendors in the system.
      parameters:
