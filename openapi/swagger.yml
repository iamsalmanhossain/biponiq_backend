components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Success:
      description: Success
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            badRequest:
              value:
                success: false
                message: Bad Request
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Account is not active
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                success: false
                message: Your account is not active yet. Please wait for approval.
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            vendorExists:
              value:
                success: false
                message: Vendor Already Exists!
            emailExists:
              value:
                success: false
                message: Email Already Exists!
            subDomainExists:
              value:
                success: false
                message: SubDomain Already Exists!
    InvalidVerificationCode:
      description: Invalid or expired verification code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidCode:
              value:
                success: false
                message: Invalid or expired verification code
    VendorNotFound:
      description: Vendor Not Found
      content:
        application/json:
          example:
            success: false
            statusCode: 404
            message: Vendor not found
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          example:
            success: false
            statusCode: 500
            message: Something went wrong
