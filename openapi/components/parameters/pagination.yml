page:
  name: page
  in: query
  required: false
  schema:
    type: integer
    default: 1
    minimum: 1
  description: Page number

limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    default: 10
    minimum: 1
    maximum: 100
  description: Number of items per page
